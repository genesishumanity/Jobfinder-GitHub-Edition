name: Test Telegram Notification

# Manually trigger from the Actions tab to send one Telegram test message.
on:
  workflow_dispatch:

jobs:
  test:
    name: Send test push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send test Telegram notification
        run: python telegram_notify.py --test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
