name: Nightly Job Triage

on:
  schedule:
    # Run after the main discovery window. The agent scores every not-yet-scored
    # role in all_jobs.json, so delayed source runs roll into the next pass.
    - cron: "0 9 * * *"

  workflow_dispatch:

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  triage:
    name: Score new roles vs Can remote profile
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Anthropic SDK
        run: pip install anthropic

      # Profile/resume arrive as env vars straight from Actions secrets —
      # never written to disk, never committed.
      - name: Run Can remote-creative triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CANDIDATE_RESUME: ${{ secrets.CANDIDATE_RESUME }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$CANDIDATE_PROFILE" ]; then
            echo "Optional AI triage skipped: ANTHROPIC_API_KEY and/or CANDIDATE_PROFILE is not configured."
            echo "Deterministic source filters and Telegram delivery remain active."
            exit 0
          fi
          python triage_can.py --limit 300

      - name: Commit scores to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f output/scores.json
          git diff --cached --quiet || git commit -m "chore: update fit scores [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X ours origin main
          git push
