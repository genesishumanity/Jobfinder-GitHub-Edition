name: Weekly Job Digest

# Monday morning, sent to Telegram (2026-09-15: switched from Pushover, a
# channel Can never configured — Telegram is the channel he actually watches).
on:
  schedule:
    - cron: "30 16 * * 1"
  workflow_dispatch:

jobs:
  digest:
    name: Send weekly Telegram digest
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send weekly digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly_digest.py --days 7
