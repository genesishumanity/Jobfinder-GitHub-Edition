name: JobFinder Weekly Digest

# Monday morning, sent to Telegram. (2026-09-15: this replaces the old
# weekly_digest.yml — that workflow got permanently stuck at "queued" on
# GitHub's side, never creating a job, on both API and UI-triggered
# dispatches, while every other workflow in this repo dispatched normally
# in the same window. Root cause unconfirmed; recreating under a new
# filename to get a fresh workflow registration was the practical fix.)
on:
  schedule:
    - cron: "30 16 * * 1"
  workflow_dispatch:

jobs:
  digest:
    name: Send weekly Telegram digest
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send weekly digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly_digest.py --days 7
